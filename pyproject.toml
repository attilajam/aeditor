[project]
name = "scene-splitter"
version = "0.4.0"
description = "Automatic beat-matched editing with visual and motion continuity"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.11,<1.1",
    "madmom @ git+https://github.com/CPJKU/madmom.git",
    # madmom imports pkg_resources, removed from setuptools 81+
    "setuptools<81",
    "numpy>=2.1,<3",
    "opencv-python>=4.11,<6",
    "pyyaml>=6,<7",
    "scenedetect>=0.7.2,<0.8",
]

[project.scripts]
scene-split = "scene_splitter.cli:main"
autoedit = "autoedit.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/autoedit", "src/scene_splitter"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/VALIDATION.md", "/NATIVE_SENSITIVE_VALIDATION.md", "/QUIET_SECTIONS_VALIDATION.md", "/WEB_REVIEW_VALIDATION.md", "/SPATIAL_MATCHING_VALIDATION.md", "/config.example.yaml", "/requirements.lock", "/uv.lock", "/.python-version", "/pyproject.toml"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

# madmom 0.16.1 (and master) omit build deps for its Cython extensions and
# numpy for the build itself; keep in sync if madmom is ever replaced.
[tool.uv.extra-build-dependencies]
madmom = ["Cython", "setuptools<81", "numpy"]
