[workspace]
resolver = "2"
members = [
    "crates/ae-core",
    "crates/ae-media",
    "crates/ae-shots",
    "crates/ae-beats",
    "crates/ae-similarity",
    "crates/ae-sequencer",
    "crates/ae-transitions",
    "crates/ae-transitions-gpu",
    "crates/ae-render",
    "crates/ae-cli",
    "crates/ae-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["auto-editor-rs contributors"]

[workspace.dependencies]
ae-core = { path = "crates/ae-core" }
ae-media = { path = "crates/ae-media" }
ae-shots = { path = "crates/ae-shots" }
ae-beats = { path = "crates/ae-beats" }
ae-similarity = { path = "crates/ae-similarity" }
ae-sequencer = { path = "crates/ae-sequencer" }
ae-transitions = { path = "crates/ae-transitions" }
ae-transitions-gpu = { path = "crates/ae-transitions-gpu" }
ae-render = { path = "crates/ae-render" }

anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
indicatif = "0.18.6"
rayon = "1.12.0"
crossbeam-channel = "0.5.17"
lru = "0.19.0"
num-rational = { version = "0.4.2", features = ["serde"] }
num-traits = "0.2.19"
sha2 = "0.11.1"
hex = "0.4.3"
tempfile = "3.27.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.34.1"
wide = "1.7.1"
rand = "0.10.3"
rand_chacha = "0.10.0"

# Media & Image
ffmpeg-sidecar = "2.7.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = "0.27.0"
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
image_hasher = "3.1.1"
dssim-core = "3.5.1"
palette = "0.7.7"
rgb = "0.8"

# Audio & DSP
symphonia = { version = "0.6.1", features = ["all"] }
rubato = "5.0.1"
realfft = "3.5.0"
rustfft = "6.4.1"
biquad = "0.6.0"
hound = "3.5.1"

# ML & Search
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-31"] }
ndarray = "0.17.2"
hnsw_rs = "0.3.5"

# Transitions & GPU
inventory = "0.3.25"
simple-easing = "1.1.1"
wgpu = "30.0.1"
pollster = "0.4"

# GUI (egui / eframe)
egui = "0.37.0"
eframe = "0.37.0"
rfd = "0.17.2"

# Ensure dependencies and DSP/image loops run at full release speed even under `cargo run`
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

